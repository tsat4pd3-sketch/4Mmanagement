services:
  - type: web
    name: 4mmanagement
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # กัน "แท็บใหม่ได้เวอร์ชันเก่า": html/version.json ต้อง revalidate ทุกครั้ง (no-cache)
    # ส่วนไฟล์ใน assets/ ชื่อมี hash อยู่แล้ว cache ยาวได้เต็มที่ (immutable)
    # ⚠️ ถ้า service บน Render ไม่ได้สร้างจาก Blueprint ไฟล์นี้จะไม่มีผล — ต้องไปตั้ง
    #    Headers 2 rules เดียวกันนี้ใน Render dashboard (Static Site → Redirects/Headers)
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # โมเดล/WASM ของ MediaPipe (Gesture Mode) ไฟล์ใหญ่ ~19MB และแทบไม่เปลี่ยน —
      # cache 30 วันกันดาวน์โหลดซ้ำทุกครั้งที่เปิดโหมดประชุม (เปลี่ยนเวอร์ชันโมเดล = เปลี่ยนชื่อไฟล์)
      - path: /mediapipe/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: Cache-Control
        value: no-cache
    # ⚠️ ต้องตั้งค่าจริงใน Render dashboard ทั้ง 4 ตัว (sync:false = ไม่เก็บค่าในไฟล์นี้)
    #    ฝั่ง DR ยังไม่ได้ตั้งมาแต่เดิม → แอป fallback ไปค่าที่ฝังในโค้ด (src/utils/appConfig.js)
    #    ตั้งให้ครบแล้วป้ายเตือนแดงบนจอ admin จะหายไปเอง · ดู docs/SELF-HOST-MIGRATION.md
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_DR_URL
        sync: false
      - key: VITE_SUPABASE_DR_KEY
        sync: false
