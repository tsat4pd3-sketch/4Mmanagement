services:
  - type: web
    name: 4mmanagement
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    # deploy เป็นรอบทุกชั่วโมงผ่าน Deploy Hook (.github/workflows/scheduled-deploy.yml) — ห้ามเปิดคืน
    # service นี้ "Blueprint managed" ⇒ ปิดใน dashboard อย่างเดียว sync รอบหน้าอาจเปิดกลับ
    autoDeploy: false
    # ประหยัด pipeline minutes (2026-10-13 · build ล่มเพราะโควต้าเดือนหมด) — push ที่แก้แค่
    # เอกสาร .md / ตั้งค่า AI ไม่ต้อง build (ไม่เปลี่ยนเว็บ) · ห้ามใส่ docs/** ทั้งโฟลเดอร์:
    # เทสอ่าน docs/**/*.py · ⚠️ มีผลเฉพาะ service ที่สร้างจาก Blueprint — ไม่งั้นตั้งใน dashboard
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
        - ".claude/**"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # กัน "แท็บใหม่ได้เวอร์ชันเก่า": html/version.json ต้อง revalidate ทุกครั้ง (no-cache)
    # ส่วนไฟล์ใน assets/ ชื่อมี hash อยู่แล้ว cache ยาวได้เต็มที่ (immutable)
    # ⚠️ ถ้า service บน Render ไม่ได้สร้างจาก Blueprint ไฟล์นี้จะไม่มีผล — ต้องไปตั้ง
    #    Headers 2 rules เดียวกันนี้ใน Render dashboard (Static Site → Redirects/Headers)
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # โมเดล/WASM ของ MediaPipe (Gesture Mode) ไฟล์ใหญ่ ~19MB และแทบไม่เปลี่ยน —
      # cache 30 วันกันดาวน์โหลดซ้ำทุกครั้งที่เปิดโหมดประชุม (เปลี่ยนเวอร์ชันโมเดล = เปลี่ยนชื่อไฟล์)
      - path: /mediapipe/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ══ 🚀 เว็บ New Model (IEC) — deploy แยกจากระบบแมส (2026-10-29 · คำสั่ง user) ══════════
  #    *"งาน New Model ได้รับคำสั่งมาให้แยก frontend ออกจากของเดิม"*
  #    โค้ดชุดเดียวกับ service ข้างบน (รีโปเดียว ไม่มี drift) — ต่างแค่ build command
  #    `npm run build:nm` → `dist-nm/` (หน้าที่เว็บนี้มี = src/appEdition.nm.js)
  #
  #    🔴 **ตั้งใจแยก service เพื่อให้ "แมสกับ NM ไม่ล้มพร้อมกัน"** — deploy คนละรอบ
  #       build NM ล่ม = เว็บแมสไม่กระเทือน และกลับกัน
  #    ⚠️ ไฟล์นี้มีผลเฉพาะ service ที่สร้างจาก Blueprint — ถ้า Render ยังไม่เห็น service นี้
  #       ต้องกด "New → Blueprint" (หรือ Sync) ใน dashboard ครั้งแรกครั้งเดียว
  #    ⚠️ ต้องกรอก env 2 ตัวใน dashboard เหมือน service หลัก (sync: false = ไม่ดึงจากไฟล์)
  #       — ใช้ **Supabase Main ตัวเดิม + บัญชีเดิม** ตามที่ user เลือก (ไม่ใช่ project ใหม่)
  - type: web
    name: 4mmanagement-nm
    env: static
    buildCommand: npm run build:nm
    staticPublishPath: ./dist-nm
    # เหตุผลเดียวกับ service หลัก — deploy เป็นรอบผ่าน Deploy Hook ห้ามเปิด autoDeploy คืน
    autoDeploy: false
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
        - ".claude/**"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # ชุดเดียวกับเว็บหลัก — html/version.json ต้อง revalidate ทุกครั้ง · assets/ มี hash แล้ว cache ยาวได้
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /mediapipe/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
