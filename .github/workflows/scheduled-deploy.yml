# Deploy Render แบบ "ตาม merge + กันถี่" (2026-10-13 · pipeline minutes ของ Render หมดกลางเดือน)
# 📄 docs/modules/deploy.md §Deploy ตาม merge + กันถี่
# - push เข้า main → ถ้า deploy ล่าสุดเก่ากว่า MAX_WAIT นาที = deploy ทันที
#   ไม่งั้นรอให้เงียบ QUIET นาที (push ใหม่ระหว่างรอ = ยกเลิกตัวเก่า เริ่มนับใหม่) แต่ไม่เกินครบ MAX_WAIT
# - ไม่มีของใหม่ = ไม่ build · มีแค่ .md/.claude = เลื่อนตัวชี้ ไม่ build
# - cron รายชั่วโมง = ตัวสำรอง (cron ของ GitHub ไม่การันตีเวลา — 13/10 ข้าม 3 รอบติด ห้ามพึ่งอย่างเดียว)
# - 🕗 เวลาไทย 08:00-17:30 = พักไว้ ไม่ deploy (ไม่เลื่อน tag) ⇒ cron รอบหลังเลิกกะมาเก็บเอง
# - ด่วน 2 ทาง: (ก) ใส่ `[deploy-now]` ใน **บรรทัดหัวเรื่อง** ของคอมมิท/merge = deploy ทันที
#               (เนื้อความด้านล่างไม่นับ — เขียนอธิบายป้ายนี้ในเนื้อคอมมิทได้ ไม่สั่ง deploy)
#               (ข) Actions → "Scheduled deploy" → Run workflow = deploy ทันทีเสมอ (ต้องกดเอง)
# - จำว่า deploy ถึง commit ไหน/เมื่อไหร่ด้วย annotated tag `render-deployed`
# - ต้องปิด Auto-Deploy ใน Render (render.yaml autoDeploy: false) ไม่งั้น build ซ้ำ 2 ทาง
name: Scheduled deploy

on:
  push:
    branches: [main]
    # 🔴 23/11 — **ห้ามใส่ `paths-ignore` กลับมา** (เคสจริงวันนี้)
    #    user สั่ง "ดันขึ้นเลย อย่ารอ 17:30" ⇒ push คอมมิทเปล่าที่มีป้าย `[deploy-now]` ในหัวเรื่อง
    #    = **ไม่มี run เกิดขึ้นเลย** เพราะคอมมิทเปล่าไม่แตะไฟล์ไหน ⇒ ไม่มี path ไหนผ่านตัวกรอง
    #    ⇒ ทางด่วนที่เอกสารบอกว่า "ทางเดียวที่ AI session ทำเองได้" ใช้ไม่ได้จริงเมื่อไม่มีของจะแก้
    #    ตัวกรอง "แตะแค่ .md/.claude/.github = ไม่ build" อยู่ในสคริปต์อยู่แล้ว (เลื่อน tag แล้ว exit)
    #    ⇒ ตัวกรองชั้น YAML ซ้ำซ้อน และเป็นตัวที่ทำให้ป้ายด่วนหายเงียบ
  schedule:
    - cron: '7 * * * *'   # ตัวสำรอง · นาทีที่ 7 เลี่ยงคิวต้นชั่วโมง
  workflow_dispatch:

permissions:
  contents: write   # เลื่อน tag render-deployed

concurrency:
  group: scheduled-deploy
  cancel-in-progress: true   # push ใหม่ล้มตัวที่กำลังรอ = debounce

env:
  QUIET_MIN: 30
  MAX_WAIT_MIN: 60
  # 🕗 หน้าต่างห้าม deploy (เวลาไทย) — กะเช้า 08:00-17:30 · ข้ามได้ด้วย [deploy-now] / Run workflow
  HOLD_FROM: '0800'
  HOLD_TO: '1730'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Decide & deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            msg="ยังไม่ได้ตั้ง secret RENDER_DEPLOY_HOOK — ไม่มีการ deploy (ดู docs/modules/deploy.md)"
            if [ "$EVENT" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"; exit 0
          fi
          git fetch -q --force origin 'refs/tags/render-deployed:refs/tags/render-deployed' || true

          mark() {  # เลื่อน tag + เวลา (annotated)
            git -c user.name=deploy-bot -c user.email=deploy-bot@users.noreply.github.com \
              tag -f -a render-deployed -m "deployed $(date -u +%FT%TZ)" "$1"
            git push -q -f origin refs/tags/render-deployed
          }

          HEAD_SHA=$(git rev-parse origin/main)
          LAST=$(git rev-parse -q --verify 'refs/tags/render-deployed^{commit}' || true)
          LAST_AT=$(git for-each-ref --format='%(taggerdate:unix)' refs/tags/render-deployed)
          LAST_AT=${LAST_AT:-0}   # tag เก่าแบบ lightweight = ไม่รู้เวลา = ถือว่าเก่า
          echo "main=$HEAD_SHA last=${LAST:-none} last_at=$LAST_AT event=$EVENT"

          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$LAST" ]; then
            if [ "$LAST" = "$HEAD_SHA" ]; then echo "ไม่มีของใหม่ — ข้าม"; exit 0; fi
            SITE=$(git diff --name-only "$LAST" "$HEAD_SHA" | grep -vE '\.md$|^\.claude/|^\.github/' || true)
            if [ -z "$SITE" ]; then echo "มีแค่ .md/.claude/.github — เลื่อนตัวชี้ ไม่ build"; mark "$HEAD_SHA"; exit 0; fi

            # 🚀 ป้าย [deploy-now] ในข้อความคอมมิท = ข้ามทั้งหน้าต่างเวลาทำงานและการรอ (18/11 · คำสั่ง
            #    user "ให้ขึ้นเดี๋ยวนี้เลย") — ปุ่ม Run workflow ต้องใช้สิทธิ์ actions:write ซึ่ง token
            #    ของ Claude ไม่มี ⇒ ทางนี้ใช้แค่ push ธรรมดาที่มีอยู่แล้ว
            #    19/11: ดูป้ายทุก event (ไม่ใช่แค่ push) — รอบ push ที่ถูก concurrency ยกเลิกไป
            #    จะเหลือแต่ cron มาเก็บ ถ้าเช็คแค่ push ป้ายด่วนจะหายไปกับรอบที่ถูกยกเลิก
            DEPLOY_NOW=no
            #    🔴 19/11 เคสจริง: ดูทั้ง body (`%B`) = คอมมิทที่ **อธิบายเรื่องป้ายนี้** ในเนื้อความ
            #       ก็นับเป็นป้ายด่วนไปด้วย ⇒ deploy ลง 13:19 ทั้งที่ควรพักไว้
            #       ⇒ ดูเฉพาะ **บรรทัดหัวเรื่อง** (`%s`) ซึ่งเป็นที่ที่คนตั้งใจติดป้ายจริงๆ
            git log --format=%s "$LAST..$HEAD_SHA" | grep -qiF '[deploy-now]' && DEPLOY_NOW=yes

            if [ "$DEPLOY_NOW" = "yes" ]; then
              echo "เจอป้าย [deploy-now] ในคอมมิท — ข้ามหน้าต่างเวลาทำงานและการรอ ส่ง deploy ทันที"
            else
              # 🕗 หน้าต่าง deploy — ห้าม deploy ในเวลาทำงาน (26/10 · คำสั่ง user · ลงเป็นโค้ด 19/11)
              #    deploy = สลับไฟล์ชุดใหม่ ⇒ แท็บที่หน้างานเปิดค้างพังพร้อมกันทุกเครื่อง
              #    🔴 **พักไว้แบบ "ไม่เลื่อน tag"** — tag ยังชี้คอมมิทเก่า ⇒ cron รอบหลังเลิกกะ
              #       (นาทีที่ 7 ของทุกชั่วโมง) มาเก็บ deploy ให้เอง ไม่มีของตกค้างถาวร
              #    ด่วนจริง 2 ทาง: ใส่ [deploy-now] ในข้อความคอมมิท/merge · หรือกด Run workflow
              BKK_HM=$(TZ=Asia/Bangkok date +%H%M)
              if [ "$((10#$BKK_HM))" -ge "$((10#$HOLD_FROM))" ] && [ "$((10#$BKK_HM))" -lt "$((10#$HOLD_TO))" ]; then
                echo "เวลาไทย ${BKK_HM} อยู่ในกะทำงาน (${HOLD_FROM}-${HOLD_TO}) — พักไว้ ยังไม่ deploy"
                echo "   tag render-deployed ไม่ถูกเลื่อน ⇒ cron รอบแรกหลังเลิกกะจะ deploy $HEAD_SHA เอง"
                exit 0
              fi
              if [ "$EVENT" = "push" ]; then
                NOW=$(date +%s)
                DUE=$(( LAST_AT + MAX_WAIT_MIN*60 ))
                if [ "$NOW" -lt "$DUE" ]; then
                  WAIT=$(( QUIET_MIN*60 ))
                  [ $(( DUE - NOW )) -lt "$WAIT" ] && WAIT=$(( DUE - NOW ))
                  echo "deploy ล่าสุดยังไม่ครบ ${MAX_WAIT_MIN} นาที — รอ ${WAIT}s (push ใหม่ระหว่างนี้จะยกเลิกรอบนี้)"
                  sleep "$WAIT"
                  git fetch -q origin main
                  HEAD_SHA=$(git rev-parse origin/main)
                fi
              fi
            fi
          fi

          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "${HOOK}&ref=${HEAD_SHA}")
          cat /tmp/resp; echo
          if [ "${code#2}" = "$code" ]; then
            echo "::error::Render deploy hook ตอบ HTTP $code — ไม่ได้ deploy"; exit 1
          fi
          mark "$HEAD_SHA"
          echo "สั่ง deploy $HEAD_SHA แล้ว (ดูผล build ที่ Render)"
