# 🧹 ลบ branch ที่ merge เข้า main ครบแล้ว — ตามรายชื่อในไฟล์ (2026-11-23 · คำสั่ง user)
# กดเองเท่านั้น: Actions → "Branch cleanup" → Run workflow
#   · dry_run = true (ค่าเริ่มต้น) → แค่บอกว่าจะลบตัวไหน/ข้ามตัวไหน ไม่ลบจริง
#   · dry_run = false → ลบจริง
# ไฟล์รายชื่อ: บรรทัดละ `<sha> <branch> <วันที่>` · บรรทัดขึ้นต้น # = หมายเหตุ
#
# 🔴 ด่านก่อนลบ "ทุกตัว" (ไม่ผ่านข้อใด = ข้าม ไม่ลบ):
#   1. ห้ามแตะ main และ branch ที่ไม่ได้ขึ้นต้น claude/ หรือ fix/
#   2. SHA ปัจจุบันของ branch ต้อง "เท่ากับ" ที่จดไว้ในไฟล์ — มีใคร push เพิ่มหลังจดรายชื่อ = ข้าม
#   3. commit ปลาย branch ต้องอยู่ใน main แล้ว (merge-base --is-ancestor) — ไม่มีงานหาย
# กู้คืน: git push origin <sha>:refs/heads/<branch>  (sha อยู่ในไฟล์รายชื่อ · commit อยู่ใน main ทุกตัว)
name: Branch cleanup

on:
  workflow_dispatch:
    inputs:
      list_file:
        description: 'ไฟล์รายชื่อ branch (sha branch date)'
        required: true
        default: 'docs/_branch-cleanup/2026-11-23-merged.txt'
      dry_run:
        description: 'ทดลองดูก่อน ไม่ลบจริง'
        type: boolean
        default: true

permissions:
  contents: write   # ลบ branch

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ลบตามรายชื่อ (ผ่านด่าน 3 ข้อเท่านั้น)
        env:
          LIST: ${{ inputs.list_file }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -u
          if [ ! -f "$LIST" ]; then echo "::error::ไม่พบไฟล์ $LIST"; exit 1; fi
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          del=0; skip=0; gone=0; fail=0
          while read -r sha br _; do
            case "$sha" in ''|\#*) continue ;; esac
            case "$br" in
              main|'') echo "⛔ ข้าม (ห้ามแตะ): '$br'"; skip=$((skip+1)); continue ;;
              claude/*|fix/*) ;;
              *) echo "⛔ ข้าม (ไม่ใช่ claude/ หรือ fix/): $br"; skip=$((skip+1)); continue ;;
            esac
            cur=$(git rev-parse -q --verify "refs/remotes/origin/$br" || true)
            if [ -z "$cur" ]; then echo "· ไม่มีแล้ว: $br"; gone=$((gone+1)); continue; fi
            if [ "$cur" != "$sha" ]; then echo "⚠️ ข้าม (มีคน push เพิ่มหลังจดรายชื่อ): $br"; skip=$((skip+1)); continue; fi
            if ! git merge-base --is-ancestor "$cur" origin/main; then echo "⚠️ ข้าม (ยังมีงานที่ไม่อยู่ใน main): $br"; skip=$((skip+1)); continue; fi
            if [ "$DRY" = "true" ]; then echo "🧪 จะลบ: $br"; del=$((del+1)); continue; fi
            if git push -q origin --delete "$br"; then echo "🗑️ ลบแล้ว: $br"; del=$((del+1)); else echo "❌ ลบไม่สำเร็จ: $br"; fail=$((fail+1)); fi
          done < "$LIST"
          mode=$([ "$DRY" = "true" ] && echo "ทดลอง (ไม่ได้ลบจริง)" || echo "ลบจริง")
          echo "──────── สรุป [$mode] ────────"
          echo "ลบ/จะลบ $del · ข้าม $skip · ไม่มีแล้ว $gone · ล้มเหลว $fail"
          {
            echo "### 🧹 Branch cleanup — $mode"
            echo "| ลบ/จะลบ | ข้าม | ไม่มีแล้ว | ล้มเหลว |"
            echo "|---|---|---|---|"
            echo "| $del | $skip | $gone | $fail |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" = 0 ]
