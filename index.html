<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ESM — Enterprise Shopfloor Management · Thai Summit Group</title>
    <!-- PWA: เพิ่มลงหน้าจอโฮม เปิดเหมือนแอป (ชอร์ตคัตมือถือ) — manifest-only ไม่มี service worker
         (กัน cache ชนกับ version-guard/no-cache ที่มีอยู่ ดู main.jsx + render.yaml) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080f08" />
    <meta name="application-name" content="ESM" />
    <!-- iOS: apple-touch-icon ต้องเป็น PNG (ไม่รองรับ SVG) + เปิดแบบ standalone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ESM" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>(function(){var t=localStorage.getItem('4m-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <div id="root"></div>
    <!-- 🔴 ตาข่ายกัน "จอขาวสนิท" (2026-10-26 · หน้างานแจ้ง จอขาวทั้งคอมและมือถือ)
         ถ้าไฟล์โปรแกรม (chunk) โหลดไม่ได้ หรือพังตั้งแต่ตอน import — React ไม่เคยขึ้น
         ⇒ RootErrorBoundary ไม่เคยถูกสร้าง ⇒ **ไม่มีอะไรบนจอเลย** คนหน้างานไม่รู้ว่าต้องทำอะไร
         ตาข่ายนี้อยู่ใน index.html จึงทำงานได้แม้โปรแกรมหลักโหลดไม่ขึ้นสักบรรทัด
         ⚠️ ต้องเป็น JS แบบเก่า (จอ TV = Chromium 94) · ห้ามใช้ CSS สมัยใหม่ -->
    <div id="boot-fallback" style="display:none;position:fixed;inset:0;z-index:99999;background:#0b120b;color:#e8f0e8;font-family:Sarabun,system-ui,sans-serif;padding:24px;text-align:center;align-items:center;justify-content:center;flex-direction:column">
      <div style="font-size:40px;line-height:1.2;margin-bottom:10px">📡</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:8px">เปิดโปรแกรมไม่สำเร็จ</div>
      <div id="boot-why" style="font-size:13px;opacity:.78;line-height:1.7;max-width:460px;margin-bottom:18px">
        โหลดไฟล์โปรแกรมไม่ครบ — มักเกิดจากไฟล์เวอร์ชันเก่าค้างในเครื่อง หรือเน็ตสะดุดตอนเปิด
      </div>
      <button id="boot-retry" style="font-size:15px;font-weight:700;padding:12px 22px;border-radius:10px;border:0;background:#22c55e;color:#06220c;cursor:pointer;font-family:inherit">
        🔄 ล้างของเก่าแล้วเปิดใหม่
      </button>
      <div style="font-size:11.5px;opacity:.55;margin-top:14px;line-height:1.6">
        กดแล้วยังไม่ขึ้น = แจ้งทีมระบบ พร้อมบอกว่า "เปิดโปรแกรมไม่สำเร็จ"
      </div>
    </div>
    <script>
      (function () {
        var shown = false;
        function show(why) {
          if (shown || window.__ESM_MOUNTED) return;
          shown = true;
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          if (why) { var w = document.getElementById('boot-why'); if (w) w.textContent = why; }
          el.style.display = 'flex';
        }
        /* ไฟล์ js/css โหลดไม่ได้ (chunk หาย/404 หลัง deploy · เน็ตตัด) — รู้ทันทีไม่ต้องรอครบเวลา */
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            show('โหลดไฟล์โปรแกรมไม่ได้ (อาจเป็นไฟล์เวอร์ชันเก่าค้างอยู่ในเครื่อง)');
          }
        }, true);
        /* เผื่อกรณีเงียบ: ไม่ขึ้น error แต่ก็ไม่เคย mount */
        setTimeout(function () { show(); }, 15000);
        /* 🔴 ปุ่มต้อง "ล้างของเก่า" จริง ไม่ใช่ reload เฉยๆ — reload ธรรมดาได้ index.html ตัวเดิมจาก cache
           = วนขาวซ้ำ (เหตุผลเดียวกับที่หน้างานกด F5 แล้วไม่หาย) */
        var btn = document.getElementById('boot-retry');
        if (btn) btn.onclick = function () {
          btn.disabled = true; btn.textContent = 'กำลังล้าง…';
          var done = function () {
            try { sessionStorage.clear(); } catch (x) {}
            location.replace(location.pathname + '?fresh=' + Date.now());
          };
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).then(done, done);
            } else { done(); }
          } catch (x) { done(); }
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
