# ══ nginx ของอิมเมจ ESM (ใช้กับ Dockerfile) · 2026-11-13 ══
# 🔴 กฎชุดนี้ลอกจาก render.yaml (routes + headers) — แก้ที่หนึ่งต้องตามไปแก้อีกที่
#    จนกว่าจะเลิกใช้ Render
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ไฟล์ใน assets/ ชื่อมี hash แล้ว ⇒ cache ยาวได้เต็มที่
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # โมเดล/WASM ของ MediaPipe ไฟล์ใหญ่ แทบไม่เปลี่ยน ⇒ cache 30 วัน
    location /mediapipe/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ที่เหลือ (index.html · version.json · changelog.json ฯลฯ) ต้อง revalidate ทุกครั้ง
    # กัน "แท็บใหม่ได้เวอร์ชันเก่า" · path ที่ไม่มีไฟล์ = ส่ง index.html (SPA rewrite)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
